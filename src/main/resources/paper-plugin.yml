name: uSurvive
version: '1.0'
author: killercreepr
main: killercreepr.usurvive.core.USurvivePlugin
bootstrapper: killercreepr.usurvive.core.USurviveBootstrapper
api-version: '1.19'
load: STARTUP
dependencies:
  bootstrap:
    CruxCore:
      load: BEFORE

  server:
    CruxCore:
      load: BEFORE
      required: true # Defaults to true
      join-classpath: true # Defaults to true
    CruxTeleport:
      load: BEFORE
    CruxCurrency:
      required: false
    CruxClaims:
      load: AFTER
    CruxFriends:
      load: AFTER
    CruxParty:
      load: AFTER
    QuickShop-Hikari:
      load: BEFORE
      required: false
    CruxWarps:
      load: AFTER
      required: false
    CruxRewards:
      required: false
    CruxEntityBlocks:
      required: false
    CruxCharms:
      required: false
    CruxEnchantsOverhaul:
      required: false
